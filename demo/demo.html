<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Dictator demo</title>
<style>
  :root {
    /* Primitives */
    --color-black: #000000;
    --color-ink-900: #0d0d0d;
    --color-ink-850: #1c1c1e;
    --color-ink-800: #161616;
    --color-ink-750: #2a2a2c;
    --color-ink-700: #242424;
    --color-ink-600: #333333;
    --color-grey-500: #8a8a8a;
    --color-white: #f2f2f2;
    --color-red-500: #ff2d2d;
    --color-green-500: #22c55e;
    --color-traffic-red: #ff5f57;
    --color-traffic-yellow: #febc2e;
    --color-traffic-green: #28c840;

    --font-mono: "SF Mono", Menlo, Monaco, monospace;
    --font-sans: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
    --font-size-term: 15px;
    --line-height-term: 21px;
    --font-size-note: 17px;
    --line-height-note: 26px;
    --font-size-note-title: 26px;
    --font-size-note-date: 12px;
    --font-size-key: 18px;

    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-6: 28px;
    --space-7: 40px;

    --window-size: 610px;
    --radius-window: 12px;
    --radius-key: 10px;
    --shadow-window: 0 30px 80px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.08);

    /* Semantic */
    --color-stage: var(--color-black);
    --color-window: var(--color-ink-900);
    --color-titlebar: var(--color-ink-800);
    --color-note: var(--color-ink-850);
    --color-note-toolbar: var(--color-ink-750);
    --color-text: var(--color-white);
    --color-muted: var(--color-grey-500);
    --color-recording: var(--color-red-500);
    --color-ready: var(--color-green-500);
    --color-key-bg: var(--color-ink-700);
    --color-key-border: var(--color-ink-600);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1332px; height: 740px; overflow: hidden; background: var(--color-stage); }
  #stage { position: relative; width: 1332px; height: 740px; background:
      radial-gradient(ellipse at 50% 40%, #121212 0%, var(--color-stage) 70%); }

  .window { position: absolute; top: var(--space-7); width: var(--window-size); height: var(--window-size);
    border-radius: var(--radius-window); box-shadow: var(--shadow-window); overflow: hidden; }
  .titlebar { height: 34px; display: flex; align-items: center; padding: 0 var(--space-3); position: relative; }
  .light { width: 12px; height: 12px; border-radius: 50%; margin-right: var(--space-2); }
  .titlebar .title { position: absolute; left: 0; right: 0; text-align: center; font: 600 13px var(--font-sans);
    color: var(--color-muted); pointer-events: none; }

  #notes { left: var(--space-7); background: var(--color-note); }
  #notes .titlebar { height: 46px; background: var(--color-note-toolbar); }
  #note { padding: var(--space-4) var(--space-6); font: var(--font-size-note)/var(--line-height-note) var(--font-sans);
    color: var(--color-text); }
  #note .date { font-size: var(--font-size-note-date); color: var(--color-muted); text-align: center; margin-bottom: var(--space-3); }
  #note h1 { font-size: var(--font-size-note-title); line-height: 34px; font-weight: 700; margin-bottom: var(--space-2); }
  #note p { min-height: var(--line-height-note); }
  #caret { display: inline-block; width: 2px; height: 20px; margin-right: -2px; vertical-align: -4px; background: var(--color-text); }

  #terminal { left: calc(var(--space-7) + var(--window-size) + 32px); background: var(--color-window); }
  #terminal .titlebar { background: var(--color-titlebar); border-bottom: 1px solid rgba(255,255,255,0.06); }
  #screen { padding: var(--space-3) var(--space-4); font: var(--font-size-term)/var(--line-height-term) var(--font-mono);
    color: var(--color-text); white-space: pre; font-variant-ligatures: none; }
  .row { height: var(--line-height-term); overflow: hidden; }
  .m { color: var(--color-muted); }
  .b { font-weight: 700; }
  .red { color: var(--color-recording); }
  .green { color: var(--color-ready); }
  .cursor { background: var(--color-text); color: var(--color-window); }
  .wm { font-weight: 700; line-height: var(--line-height-term); }

  #dictator { position: absolute; left: 0; top: 0; transform-origin: 50% 100%; }
  #dictator canvas { display: block; image-rendering: pixelated; filter: drop-shadow(0 8px 18px rgba(0,0,0,0.6)); }

  #keys { position: absolute; left: 0; right: 0; top: 676px; display: flex; justify-content: center; gap: var(--space-3); }
  .key { font: 600 var(--font-size-key) var(--font-sans); color: var(--color-text); background: var(--color-key-bg);
    border: 1px solid var(--color-key-border); border-bottom-width: 3px; border-radius: var(--radius-key);
    padding: 7px 16px; min-width: 46px; text-align: center; }
  .key small { font-weight: 500; color: var(--color-muted); font-size: 14px; margin-left: 6px; }
</style>
</head>

function drawGrid(ctx, grid, ox, oy, cell) {
  grid.forEach((row, y) => [...row].forEach((ch, x) => {
    if (ch === ".") return;
    ctx.fillStyle = ch === "k" ? "#000" : "#fff";
    ctx.fillRect(Math.floor(ox + x * cell), Math.floor(oy + y * cell), Math.ceil(cell + 0.25), Math.ceil(cell + 0.25));
  }));

const withEyes = eyes => PIXELS.faces[0].map((row, y) => eyes[y - 18] ? row.slice(0, 15) + eyes[y - 18] + row.slice(35) : row);
const FORWARD = withEyes(FORWARD_EYES);
const TALK = [2, 4, 1, 5, 3, 1, 4, 2, 5, 3];
// The panel reserves the enlarged bubble's width in every state, so the head never shifts.
const CELL = 1.5, BUBBLE_SCALE = 1.2, GAP = 8, CARET_GAP = 12;
const dcanvas = document.getElementById("dcanvas");
dcanvas.width = (38 + Math.ceil(23 * BUBBLE_SCALE)) * CELL + 4; dcanvas.height = 45 * CELL;
const dctx = dcanvas.getContext("2d");
function drawDictator(face, dots) {
  dctx.clearRect(0, 0, dcanvas.width, dcanvas.height);
  drawGrid(dctx, face, 0, 0, CELL);
  if (dots > 0) drawGrid(dctx, PIXELS.bubbles[dots - 1], 38 * CELL, 5 * CELL, CELL * BUBBLE_SCALE);
}

// ---- Text helpers -----------------------------------------------------------
// A line is an array of [text, class] segments.
const S = (text, cls = "") => [text, cls];
const width = segs => segs.reduce((n, [t]) => n + [...t].length, 0);
function wrap(segs, limit = COLS - 1) {
  if (width(segs) <= limit) return [segs];
  const plain = segs.map(s => s[0]).join("");
  let indent = plain.match(/^ */)[0].length;
  const rest = plain.slice(indent);
  if ("⏺⎿›".includes(rest[0]) && rest[1] === " ") indent += 2;
  const chars = segs.flatMap(([t, c]) => [...t].map(ch => [ch, c]));
  const lines = []; let start = 0, first = true;
  while (start < chars.length) {
    const room = first ? limit : limit - indent;
    let end = Math.min(chars.length, start + room);
    if (end < chars.length) { let sp = end; while (sp > start && chars[sp][0] !== " ") sp--; if (sp > start) end = sp; }
    let line = chars.slice(start, end);
    if (!first) line = [...Array(indent)].map(() => [" ", ""]).concat(line);
    lines.push(line);
    start = end; while (start < chars.length && chars[start][0] === " ") start++;
    first = false;
  }
  return lines;
}
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
const html = segs => segs.map(([t, c]) => c ? `<span class="${c}">${esc(t)}</span>` : esc(t)).join("");

// ---- Timeline ---------------------------------------------------------------
const TEXT1 = "Move the design review to Thursday at three.";
const TEXT2 = "Fix the login bug before the Friday release.";
const T = {
  rec1: [1.2, 4.6], done1: 5.3, newline: 6.1,
  rec2: [6.9, 9.9], done2: 10.6,
  slash: 11.6, down: 12.2, tab: 12.8, cdown1: 13.5, cdown2: 14.0, pickCopy: 14.7, end: 17.0,
};
const KEYS = [
  [T.rec1[0], 0.8, "Right ⌘", "start"], [T.rec1[1], 0.8, "Right ⌘", "stop"],
  [T.newline, 0.5, "⏎"],
  [T.rec2[0], 0.8, "Right ⌘", "start"], [T.rec2[1], 0.8, "Right ⌘", "stop"],
  [T.slash, 0.5, "/"], [T.down, 0.45, "↓"], [T.tab, 0.5, "Tab"],
  [T.cdown1, 0.45, "↓"], [T.cdown2, 0.45, "↓"], [T.pickCopy, 0.55, "⏎"],
];
// Slash suggestions as TerminalConsole draws them (/accessibility is hidden once granted).
const COMMANDS = [
  ["mic", "choose a microphone, or pick number n"],
  ["copy", "copy the last dictation, or the n-th from the end"],
  ["status", "model, microphone, permissions"],
  ["clear", "clear the screen"],
  ["quit", "quit Dictator (Ctrl+C works too)"],
];
const snippet = s => { if (s.length <= 40) return s; const cut = s.slice(0, 40); return cut.slice(0, cut.lastIndexOf(" ")).replace(/[.,]$/, "") + "…"; };
const WORDMARK = [
  "▀▀▀▀▀▀╗ ▀▀╗▀▀▀▀▀▀▀╗▀▀▀▀▀▀▀▀╗ ▀▀▀▀▀╗ ▀▀▀▀▀▀▀▀╗ ▀▀▀▀▀▀╗ ▀▀▀▀▀▀╗",
  "▀▀╔══▀▀╗▀▀║▀▀╔════╝╚══▀▀╔══╝▀▀╔══▀▀╗╚══▀▀╔══╝▀▀╔═══▀▀╗▀▀╔══▀▀╗",
  "▀▀║  ▀▀║▀▀║▀▀║        ▀▀║   ▀▀▀▀▀▀▀║   ▀▀║   ▀▀║   ▀▀║▀▀▀▀▀▀╔╝",
  "▀▀║  ▀▀║▀▀║▀▀║        ▀▀║   ▀▀╔══▀▀║   ▀▀║   ▀▀║   ▀▀║▀▀╔══▀▀╗",
  "▀▀▀▀▀▀╔╝▀▀║▀▀▀▀▀▀▀╗   ▀▀║   ▀▀║  ▀▀║   ▀▀║   ╚▀▀▀▀▀▀╔╝▀▀║  ▀▀║",
  "╚═════╝ ╚═╝╚══════╝   ╚═╝   ╚═╝  ╚═╝   ╚═╝    ╚═════╝ ╚═╝  ╚═╝",
];
const answer = (command, first) => [[S(command, "b")], [S("  ⎿ ", "m"), ...first]];
const entry = (text, seconds) => [[S("⏺ "), S(text)], [S("  ⎿ inserted · " + seconds + " · " + MIC, "m")]];

function state(t) {
  const st = { lines: [], status: null, face: null, dots: 0, scale: 0,
               note: [], recording: false, overlay: [], input: "", terminalFocused: t >= T.slash };
  // Notes: the dictations land where the text cursor was.
  st.note = ["Ideas from the standup:", "Ship the onboarding flow next sprint.", ""];
  if (t >= T.done1) st.note[2] = TEXT1;
  if (t >= T.newline) st.note.push("");
  if (t >= T.done2) st.note[3] = TEXT2;

  // Terminal: banner, then one entry per dictation.
  const L = st.lines;
  L.push([]);
  WORDMARK.forEach(r => L.push([S(r, "wm")]));
  L.push([], [S("Dictator", "b"), S(" v0.3.0", "m")],
         [S("Local speech to text, nothing leaves this Mac", "m")],
         [S("Audio is deleted after transcription", "m")],
         [S("Right Command key to dictate · Esc to cancel", "m")], []);
  const push = block => { block.forEach(l => wrap(l).forEach(w => L.push(w))); L.push([]); };
  if (t >= T.done1) push(entry(TEXT1, "3.4 s"));
  if (t >= T.done2) push(entry(TEXT2, "3.0 s"));
  if (t >= T.pickCopy) push(answer("/copy 2", [S("Copied: "), S(TEXT1)]));

  // "/" lists the commands; Tab on copy lists the last dictations, newest first.
  // Rows are cut to the terminal width with an ellipsis, as Style.fit does.
  const fit = s => s.length > COLS - 3 ? s.slice(0, COLS - 4) + "…" : s;
  const row = (label, detail, selected) => selected ? [S("▸ " + fit(label + detail), "b")] : [S("  "), S(fit(label + detail), "m")];
  if (t >= T.slash && t < T.tab) {
    st.input = "/";
    const sel = t >= T.down ? 1 : 0;
    st.overlay = COMMANDS.map(([n, d], i) => row(n.padEnd(16), d, i === sel));
  } else if (t >= T.tab && t < T.pickCopy) {
    st.input = "copy ";
    const sel = t >= T.cdown2 ? 2 : t >= T.cdown1 ? 1 : 0;
    st.overlay = [row("copy".padEnd(16), COMMANDS[1][1], sel === 0),
                  row("copy ", `"${snippet(TEXT2)}"`, sel === 1),
                  row("copy ", `"${snippet(TEXT1)}"`, sel === 2)];
  }

  const rec = [T.rec1, T.rec2].find(([a, b]) => t >= a && t < b);
  const done = t >= T.rec2[1] ? T.done2 : T.done1;
  const transcribing = (t >= T.rec1[1] && t < T.done1) || (t >= T.rec2[1] && t < T.done2);
  if (rec) {
    const s = Math.floor(t - rec[0]);
    st.status = [S("● ", "red"), S(`Recording 0:${String(s).padStart(2, "0")} · ${MIC}`, "m")];
    st.recording = true;
    // The Dictator pops in, then talks: mouth every 0.11 s, bubble dots every 0.3 s.
    const e = t - rec[0];
    st.scale = Math.min(1, e / 0.18);
    const talking = e > 0.35 && (rec[1] - t) > 0.25;
    st.face = talking ? PIXELS.faces[TALK[Math.floor((e - 0.35) / 0.11) % TALK.length]] : PIXELS.faces[0];
    st.dots = talking ? 1 + Math.floor((e - 0.35) / 0.3) % 3 : 0;
  } else if (transcribing) {
    st.status = [S("◌ ", ""), S("Transcribing…", "m")];
    st.recording = true;
    // Transcribing: closed mouth, looking straight at you; gone the moment the text is inserted.
    st.face = FORWARD; st.scale = Math.min(1, (done - t) / 0.12);
  } else {
    st.status = [S("● ", "green"), S(`Ready · ${MIC}`, "m")];
  }
  return st;
}

// ---- Render -----------------------------------------------------------------
const screen = document.getElementById("screen"), note = document.getElementById("note");
function render(t) {
  const st = state(t);

  // Notes, with the caret at the end of the last paragraph. It blinks only while idle.
  // Once you type into Terminal, Notes loses focus and its caret disappears.
  const caretOn = !st.terminalFocused && (st.recording || Math.floor(t * 1.8) % 2 === 0);
  const paras = st.note.map((p, i) => `<p>${esc(p)}${i === st.note.length - 1 ? `<span id="caret" style="opacity:${caretOn ? 1 : 0}"></span>` : ""}</p>`);
  note.innerHTML = `<div class="date">9 October 2026 at 09:41</div><h1>This week</h1>` + paras.join("");

  // Terminal.
  const rule = [S("─".repeat(COLS - 1), "m")];
  let rows = st.lines.slice(-REGION);
  while (rows.length < REGION) rows.push([]);
  st.overlay.forEach((l, i) => { rows[REGION - st.overlay.length + i] = l; });
  const inputLine = st.input ? [S(st.input), S(" ", "cursor")] : [S("T", "cursor m"), S("ype / to see commands", "m")];
  rows = rows.concat([rule, inputLine, rule, st.status]);
  screen.innerHTML = rows.map(r => `<div class="row">${html(r)}</div>`).join("");

  // Windows fade in.
  const e = Math.min(1, t / 0.6), ease = 1 - Math.pow(1 - e, 3);
  document.querySelectorAll(".window").forEach(w => {
    w.style.opacity = ease; w.style.transform = `translateY(${(1 - ease) * 24}px)`;
  });

  // Dictator: centred on the caret, 12 pt below it so the text above stays readable, kept inside the Notes window.
  const d = document.getElementById("dictator");
  if (st.face && st.scale > 0) {
    drawDictator(st.face, st.dots);
    const caret = document.getElementById("caret").getBoundingClientRect();
    const win = document.getElementById("notes").getBoundingClientRect();
    const left = Math.min(Math.max(caret.left + caret.width / 2 - dcanvas.width / 2, win.left + GAP), win.right - dcanvas.width - GAP);
    d.style.left = `${Math.round(left)}px`;
    d.style.top = `${Math.round(caret.bottom + CARET_GAP)}px`;
    const s = st.scale, pop = s < 1 ? s * (1 + 0.12 * Math.sin(s * Math.PI)) : 1;
    d.style.opacity = Math.min(1, s * 1.5); d.style.transform = `scale(${pop})`;
  } else d.style.opacity = 0;

  // Key presses.
  document.getElementById("keys").innerHTML = KEYS
    .filter(([at, dur]) => t >= at && t < at + dur)
    .map(([, , k, n]) => `<div class="key">${k}${n ? `<small>${n}</small>` : ""}</div>`).join("");
}
window.render = render;
window.DURATION = T.end;
render(Number(new URLSearchParams(location.search).get("t") || 0));
</script>
</body>
</html>
